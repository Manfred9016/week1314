<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos // Time Travel - Interactive Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Time Travel / Sci-Fi Dark Theme */
            --bg-dark: #0d0f1a;
            --panel-bg: #161a2b;
            --neon-cyan: #00e5ff;
            --neon-purple: #9933ff;
            --neon-gold: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff3355;
            --text-main: #f5f5f5;
            --text-muted: #9aa4b8;
            --radius-lg: 10px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(0, 229, 255, 0.08), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(153, 51, 255, 0.08), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.04), transparent 45%);
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(13, 15, 26, 0.95);
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(to right, var(--neon-cyan), var(--neon-purple), var(--neon-gold), var(--neon-cyan)) 1;
            padding: 15px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.12);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.65);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.15rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--neon-gold);
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.35);
        }

        #app-container {
            max-width: 920px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.22);
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .level-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.22);
        }

        .level-card h2, .level-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--text-main);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(153, 51, 255, 0.35);
            background-color: rgba(0, 0, 0, 0.45);
        }

        .action-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 13px 18px;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            color: var(--text-main);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 1rem;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.45);
        }

        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-correct {
            background-color: rgba(57, 255, 20, 0.2) !important;
            border-color: var(--neon-green) !important;
            color: var(--neon-green) !important;
        }

        .btn-wrong {
            background-color: rgba(255, 51, 85, 0.2) !important;
            border-color: var(--neon-red) !important;
            color: var(--neon-red) !important;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 2rem;
        }

        .reading-container {
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(153, 51, 255, 0.3);
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.08rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        .reading-container h2 {
            font-family: 'Playfair Display', serif;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1.5rem;
            padding: 1.1rem;
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 6px;
        }

        .cloud-word {
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 6px 12px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid #384166;
            transition: all 0.3s;
            text-transform: uppercase;
            border-radius: 5px;
        }

        .cloud-word.found {
            background: rgba(0, 229, 255, 0.2);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            text-decoration: line-through;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-bottom: 1px dotted #687399;
            transition: color 0.2s;
        }

        .interactive-word:hover {
            color: var(--neon-cyan);
        }

        .interactive-word.revealed {
            color: var(--neon-gold);
            font-weight: bold;
            border-bottom: none;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.4);
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 1.8rem 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 1px solid #44507a;
            background: var(--bg-dark);
            color: var(--text-main);
            margin-top: 1rem;
            text-align: center;
            border-radius: 6px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .flashcard-scene {
            width: 100%;
            height: 360px;
            perspective: 1000px;
            margin: 1.8rem 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: var(--radius-lg);
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-main);
            padding: 1.5rem;
            text-align: center;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--bg-dark);
            border-color: var(--neon-purple);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .flashcard-examples {
            margin-top: 15px;
            font-size: 1.05rem;
            color: var(--text-main);
            text-align: left;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            padding-top: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .example-en {
            color: var(--neon-gold);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .example-zh {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .sentence-dropzone, .word-bank {
            min-height: 80px;
            border: 1px dashed #4a5680;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-dark);
        }

        .draggable-word {
            padding: 10px 14px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: transform 0.15s, background 0.2s;
            user-select: none;
        }

        .draggable-word:hover {
            background: rgba(0, 229, 255, 0.18);
            transform: translateY(-2px);
        }

        .concept-display-box {
            min-height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            margin-bottom: 1.6rem;
            padding: 1.5rem;
        }

        /* Non-blocking Toast Banner (replaces browser alert) */
        #toast-banner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(22, 26, 43, 0.96);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 8px 30px rgba(0, 229, 255, 0.3);
            z-index: 999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        #toast-banner.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes popIn {
            0% { transform: scale(0.98); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.35s ease-out forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>

    <main id="app-container"></main>

    <script>
        // --- NON-BLOCKING TOAST NOTIFICATION ---
        let toastTimer = null;
        function showToast(message, accentColor) {
            const toast = document.getElementById('toast-banner');
            toast.textContent = message;
            toast.style.borderColor = accentColor || 'var(--neon-cyan)';
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2400);
        }

        // --- ANIMATED STAR / TIME-PARTICLE CANVAS ---
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#00e5ff', '#9933ff', '#ffcc00', '#39ff14', '#ffffff'];

            for (let i = 0; i < 60; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.2 + 0.6,
                    speedY: Math.random() * 0.55 - 0.275,
                    speedX: Math.random() * 0.55 - 0.275,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    const p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

                element.classList.add('revealed');
                const cloudEl = document.getElementById(`cloud-${matchedVocab.replace(/\s+/g, '-')}`);
                if (cloudEl && !cloudEl.classList.contains('found')) {
                    cloudEl.classList.add('found');
                    updateXP(5);
                    showToast(`Found "${matchedVocab}"! +5 MP`, 'var(--neon-cyan)');
                }
            } else {
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 350);
            }
        }

        // --- ACTIVITY 2: KNOWLEDGE CHECK QUIZ ---
        function startQuiz() {
            currentQuestionIndex = 0;
            renderQuiz();
        }

        function renderQuiz() {
            const qData = currentLevel.questions[currentQuestionIndex];
            const isLast = currentQuestionIndex === currentLevel.questions.length - 1;
            const isFirst = currentQuestionIndex === 0;
            let interactionHTML = '';

            if (qData.type === 'mc') {
                interactionHTML = `
                    <div id="mc-options" style="display:flex; flex-direction:column; gap:10px; margin-top: 1.5rem;">
                        ${qData.options.map((opt, index) => `
                            <button class="action-btn" style="text-align: left; text-transform:none; padding:1rem;"
                            onclick="checkQuizAnswer(this, ${index}, ${qData.answer}, 'mc')">${opt}</button>
                        `).join('')}
                    </div>`;
            } else if (qData.type === 'fill') {
                interactionHTML = `
                    <div style="margin-top: 1.5rem;">
                        <input type="text" id="fill-input" placeholder="Type answer here..." autocomplete="off">
                        <button class="action-btn" style="margin-top:1rem;" onclick="checkQuizAnswer(document.getElementById('fill-input'), null, '${escapeSingleQuotes(qData.answer)}', 'fill')">Submit Answer</button>
                    </div>`;
            }

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size: 0.9rem;">
                        <span>QUESTION ${currentQuestionIndex + 1} OF ${currentLevel.questions.length}</span>
                    </div>
                    <p style="font-size: 1.2rem; font-weight: bold; color: var(--text-main); line-height:1.5;">${qData.q}</p>
                    ${interactionHTML}

                    <div class="nav-buttons">
                        <button class="action-btn" style="width:48%;" onclick="navigateQuiz(-1)" ${isFirst ? 'disabled' : ''}>Previous</button>
                        <button class="action-btn" style="width:48%;" onclick="navigateQuiz(1)">${isLast ? 'Finish' : 'Next'}</button>
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(element, selectedIndex, correctAnswer, type) {
            if (type === 'mc') {
                const allButtons = element.parentElement.querySelectorAll('button');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (selectedIndex === correctAnswer) {
                    element.classList.add('btn-correct');
                    updateXP(15);
                    showToast('Correct! +15 Mind Points', 'var(--neon-green)');
                } else {
                    element.classList.add('btn-wrong', 'shake');
                    allButtons[correctAnswer].classList.add('btn-correct');
                    showToast('Not quite! Check the green highlight.', 'var(--neon-red)');
                }
            } else if (type === 'fill') {
                const userAnswer = element.value.trim().toLowerCase();
                const actualAnswer = String(correctAnswer).toLowerCase();
                if (userAnswer && (userAnswer === actualAnswer || userAnswer.includes(actualAnswer))) {
                    element.style.borderColor = 'var(--neon-green)';
                    element.style.color = 'var(--neon-green)';
                    updateXP(15);
                    showToast('Correct! +15 Mind Points', 'var(--neon-green)');
                } else {
                    element.style.borderColor = 'var(--neon-red)';
                    element.classList.add('shake');
                    showToast('Try again!', 'var(--neon-red)');
                    setTimeout(() => element.classList.remove('shake'), 400);
                }
            }
        }

        function navigateQuiz(direction) {
            currentQuestionIndex += direction;
            if (currentQuestionIndex >= currentLevel.questions.length) {
                showToast('Knowledge Check Completed!', 'var(--neon-gold)');
                renderMenu();
            } else {
                renderQuiz();
            }
        }

        // --- ACTIVITY 3: VOCAB FLASHCARDS (3D FLIP) ---
        function startFlashcards() {
            currentFlashcardIndex = 0;
            renderFlashcardUI();
        }

        function renderFlashcardUI() {
            const vocab = currentLevel.vocabulary;
            const currentCard = vocab[currentFlashcardIndex];

            let examplesHTML = '';
            if (currentCard.examples && currentCard.examples.length > 0) {
                examplesHTML = `<div class="flashcard-examples">` +
                    currentCard.examples.map(ex => `
                        <div class="example-item">
                            <div class="example-en">${ex.en}</div>
                            <div class="example-zh">${ex.zh}</div>
                        </div>
                    `).join('') + `</div>`;
            }

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="text-align:center;">
                    <h2 style="margin-top:0;">Vocabulary Flashcards</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem;">CARD ${currentFlashcardIndex + 1} OF ${vocab.length} • TAP CARD TO FLIP</p>

                    <div class="flashcard-scene" onclick="flipCard(this)">
                        <div class="flashcard">
                            <div class="flashcard-face flashcard-front">
                                <div style="font-size: 3rem; margin-bottom: 12px;">${currentCard.icon}</div>
                                <div>${currentCard.word}</div>
                            </div>
                            <div class="flashcard-face flashcard-back">
                                <div style="font-size: 2.8rem; margin: 12px 0 6px 0;">${currentCard.icon}</div>
                                <div style="font-size: 1.5rem; margin-bottom: 10px; color: var(--neon-cyan);">${currentCard.chinese}</div>
                                ${examplesHTML}
                            </div>
                        </div>
                    </div>

                    <div class="nav-buttons">
                        <button class="action-btn" style="width:48%;" onclick="navigateFlashcard(-1)">Previous</button>
                        <button class="action-btn" style="width:48%;" onclick="navigateFlashcard(1)">Next</button>
                    </div>
                </div>
            `;
        }

        function flipCard(sceneElement) {
            const card = sceneElement.querySelector('.flashcard');
            card.classList.toggle('is-flipped');
        }

        function navigateFlashcard(direction) {
            const vocab = currentLevel.vocabulary;
            currentFlashcardIndex += direction;
            if (currentFlashcardIndex < 0) currentFlashcardIndex = vocab.length - 1;
            if (currentFlashcardIndex >= vocab.length) currentFlashcardIndex = 0;
            renderFlashcardUI();
        }

        // --- ACTIVITY 4: UNSCRAMBLE VOCAB ---
        function startVocabUnscramble() {
            currentVocabUnscrambleIndex = 0;
            renderVocabUnscramble();
        }

        function scrambleString(str) {
            const arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            const scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

        function renderVocabUnscramble() {
            const wordsList = currentLevel.unscrambleWords;
            const originalWord = wordsList[currentVocabUnscrambleIndex];
            const scrambledWord = scrambleString(originalWord);

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="text-align:center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>WORD ${currentVocabUnscrambleIndex + 1} OF ${wordsList.length}</span>
                    </div>
                    <h2 style="margin-top:0;">Unscramble the Word</h2>

                    <div style="font-size: 2.3rem; font-weight: bold; letter-spacing: 5px; color: var(--neon-gold); margin: 1.8rem 0; font-family: 'Playfair Display', serif;">
                        ${scrambledWord.toUpperCase()}
                    </div>

                    <input type="text" id="unscramble-input" placeholder="Type correct word..." autocomplete="off">

                    <button class="action-btn" onclick="checkVocabUnscramble('${escapeSingleQuotes(originalWord)}')">Check</button>
                </div>
            `;
        }

        function checkVocabUnscramble(correctWord) {
            const inputEl = document.getElementById('unscramble-input');
            const userWord = inputEl.value.trim().toLowerCase();

            if (userWord === correctWord.toLowerCase()) {
                inputEl.style.borderColor = 'var(--neon-green)';
                inputEl.style.color = 'var(--neon-green)';
                updateXP(15);
                showToast('Correct! +15 MP', 'var(--neon-green)');
                setTimeout(() => {
                    currentVocabUnscrambleIndex++;
                    if (currentVocabUnscrambleIndex >= currentLevel.unscrambleWords.length) {
                        updateXP(50);
                        showToast('Unscramble Complete! +50 Bonus MP', 'var(--neon-gold)');
                        renderMenu();
                    } else {
                        renderVocabUnscramble();
                    }
                }, 750);
            } else {
                inputEl.style.borderColor = 'var(--neon-red)';
                inputEl.classList.add('shake');
                showToast('Try again!', 'var(--neon-red)');
                setTimeout(() => inputEl.classList.remove('shake'), 400);
            }
        }

        // --- ACTIVITY 5: SENTENCE BUILDER ---
        function startSentenceUnscramble() {
            currentSentenceIndex = 0;
            renderSentenceUnscramble();
        }

        function renderSentenceUnscramble() {
            const sentencesList = currentLevel.sentences;
            const sentence = sentencesList[currentSentenceIndex];
            const words = sentence.split(' ');

            const scrambledWords = [...words];
            for (let i = scrambledWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [scrambledWords[i], scrambledWords[j]] = [scrambledWords[j], scrambledWords[i]];
            }

            const wordsHTML = scrambledWords.map((w, i) =>
                `<div class="draggable-word" id="word-${i}" onclick="moveWordOnClick(this)">${w}</div>`
            ).join('');

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SENTENCE ${currentSentenceIndex + 1} OF ${sentencesList.length}</span>
                    </div>
                    <h2 style="margin-top:0;">Build the Sentence</h2>
                    <p style="color:var(--text-muted);">Click words in the correct order.</p>

                    <div id="sentence-answer-zone" class="sentence-dropzone"></div>
                    <div id="sentence-word-bank" class="word-bank">${wordsHTML}</div>

                    <button class="action-btn" onclick="checkSentenceUnscramble('${escapeSingleQuotes(sentence)}')">Submit</button>
                </div>
            `;
        }

        function moveWordOnClick(element) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const wordBank = document.getElementById('sentence-word-bank');

            if (element.parentNode.id === 'sentence-word-bank') {
                answerZone.appendChild(element);
            } else {
                wordBank.appendChild(element);
            }
        }

        function checkSentenceUnscramble(correctSentence) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const currentWords = Array.from(answerZone.children).map(el => el.innerText);
            const userSentence = currentWords.join(' ');

            if (userSentence === correctSentence) {
                answerZone.style.borderColor = 'var(--neon-green)';
                updateXP(25);
                showToast('Sentence Built! +25 MP', 'var(--neon-green)');
                setTimeout(() => {
                    currentSentenceIndex++;
                    if (currentSentenceIndex >= currentLevel.sentences.length) {
                        updateXP(50);
                        showToast('Sentence Builder Complete! +50 Bonus MP', 'var(--neon-gold)');
                        renderMenu();
                    } else {
                        renderSentenceUnscramble();
                    }
                }, 900);
            } else {
                answerZone.style.borderColor = 'var(--neon-red)';
                answerZone.classList.add('shake');
                showToast('Order is not quite right. Try again!', 'var(--neon-red)');
                setTimeout(() => answerZone.classList.remove('shake'), 400);
            }
        }

        // --- ACTIVITY 6: TIME CONCEPTS ---
        function startConceptChallenge() {
            conceptChallengeIndex = 0;
            activeConcepts = [...timeConceptsDB].sort(() => 0.5 - Math.random());
            renderConceptChallenge();
        }

        function renderConceptChallenge() {
            if (conceptChallengeIndex >= activeConcepts.length) {
                updateXP(40);
                showToast('Time Concepts Complete! +40 Bonus MP', 'var(--neon-gold)');
                return renderMenu();
            }

            const currentConcept = activeConcepts[conceptChallengeIndex];
            const pool = ALL_TIME_CONCEPTS.filter(name => name !== currentConcept.name).sort(() => 0.5 - Math.random());
            const options = [currentConcept.name, ...pool.slice(0, 3)].sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>CONCEPT ${conceptChallengeIndex + 1} OF ${activeConcepts.length}</span>
                    </div>

                    <div style="background: rgba(0, 229, 255, 0.08); padding: 0.7rem; border-radius: 6px; margin-bottom: 1.4rem; border-left: 3px solid var(--neon-cyan);">
                        <span style="color: var(--neon-cyan); font-size: 1rem; font-weight:bold; text-transform: uppercase;">${currentConcept.category}</span>
                    </div>

                    <div id="concept-feedback-zone" class="concept-display-box">
                        <span style="font-size: 3.6rem; user-select: none; margin-bottom: 12px;">${currentConcept.emoji}</span>
                        <p style="margin: 0; color: var(--text-main); font-size: 1.1rem; max-width: 600px;">${currentConcept.clue}</p>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">Identify this time-travel concept:</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.8rem; font-size: 0.95rem;"
                            onclick="checkConceptGuess(this, '${escapeSingleQuotes(opt)}', '${escapeSingleQuotes(currentConcept.name)}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkConceptGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                showToast('Correct Concept! +20 MP', 'var(--neon-green)');
                setTimeout(() => {
                    conceptChallengeIndex++;
                    renderConceptChallenge();
                }, 950);
            } else {
                btn.classList.add('btn-wrong', 'shake');
                const feedbackZone = document.getElementById('concept-feedback-zone');
                feedbackZone.innerHTML = `
                    <div style="color: var(--neon-red); font-size: 1.3rem; font-weight: bold; font-family: 'Playfair Display', serif;">
                        Incorrect! This matches: ${correct}.
                    </div>`;
                setTimeout(() => {
                    conceptChallengeIndex++;
                    renderConceptChallenge();
                }, 1800);
            }
        }

        // --- ACTIVITY 7: TIME IDIOM DECODE ---
        function startIdiomChallenge() {
            idiomChallengeIndex = 0;
            activeIdioms = [...timeIdiomsDB].sort(() => 0.5 - Math.random());
            renderIdiomChallenge();
        }

        function renderIdiomChallenge() {
            if (idiomChallengeIndex >= activeIdioms.length) {
                updateXP(50);
                showToast('Time Idiom Decode Complete! +50 Bonus MP', 'var(--neon-gold)');
                return renderMenu();
            }

            const currentIdiom = activeIdioms[idiomChallengeIndex];
            const pool = ALL_IDIOM_MEANINGS.filter(m => m !== currentIdiom.meaning).sort(() => 0.5 - Math.random());
            const options = [currentIdiom.meaning, ...pool.slice(0, 3)].sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>IDIOM ${idiomChallengeIndex + 1} OF ${activeIdioms.length}</span>
                    </div>

                    <div id="idiom-feedback-zone" class="concept-display-box" style="border-color: var(--neon-cyan);">
                        <span style="font-size: 3.8rem; user-select: none; margin-bottom: 14px;">${currentIdiom.emoji}</span>
                        <h2 style="margin: 0; color: var(--neon-gold); font-family: 'Playfair Display', serif; text-transform: lowercase;">"${currentIdiom.idiom}"</h2>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">What does this idiom mean?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.7rem; font-size: 0.9rem; line-height: 1.3; text-transform: none;"
                            onclick="checkIdiomGuess(this, '${escapeSingleQuotes(opt)}', '${escapeSingleQuotes(currentIdiom.meaning)}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkIdiomGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                showToast('Decoded! +20 MP', 'var(--neon-green)');
                setTimeout(() => {
                    idiomChallengeIndex++;
                    renderIdiomChallenge();
                }, 950);
            } else {
                btn.classList.add('btn-wrong', 'shake');
                const feedbackZone = document.getElementById('idiom-feedback-zone');
                feedbackZone.innerHTML = `
                    <span style="display: block; color: var(--neon-red); font-size: 1.2rem; font-weight: bold; font-family: 'Playfair Display', serif;">
                        Incorrect! It means: ${correct}.
                    </span>`;
                setTimeout(() => {
                    idiomChallengeIndex++;
                    renderIdiomChallenge();
                }, 1800);
            }
        }

        // --- ACTIVITY 8: SYNONYM MATCH ---
        function startSynonymMatch() {
            synonymChallengeIndex = 0;
            activeSynonyms = [...currentLevel.synonyms].sort(() => 0.5 - Math.random());
            renderSynonymMatch();
        }

        function renderSynonymMatch() {
            if (synonymChallengeIndex >= activeSynonyms.length) {
                updateXP(50);
                showToast('Synonym Match Complete! +50 Bonus MP', 'var(--neon-gold)');
                return renderMenu();
            }

            const currentPair = activeSynonyms[synonymChallengeIndex];
            const pool = currentLevel.synonyms
                .map(s => s.synonym)
                .filter(syn => syn !== currentPair.synonym)
                .sort(() => 0.5 - Math.random());

            const options = [currentPair.synonym, ...pool.slice(0, 3)].sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SYNONYM ${synonymChallengeIndex + 1} OF ${activeSynonyms.length}</span>
                    </div>

                    <h2 style="color: #fff; margin-bottom: 0.5rem;">Find the closest synonym for:</h2>

                    <div style="background: rgba(0, 229, 255, 0.06); padding: 1.8rem; border-radius: 6px; margin-bottom: 2rem; border: 1px dashed rgba(0, 229, 255, 0.4); text-align: center;">
                        <strong style="color: var(--neon-cyan); font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase;">
                            ${currentPair.word}
                        </strong>
                    </div>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.2rem; font-size: 1.05rem;"
                            onclick="checkSynonymGuess(this, '${escapeSingleQuotes(opt)}', '${escapeSingleQuotes(currentPair.synonym)}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkSynonymGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(15);
                showToast('Great Match! +15 MP', 'var(--neon-green)');
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 950);
            } else {
                btn.classList.add('btn-wrong', 'shake');
                allButtons.forEach(b => {
                    if (b.innerText.toLowerCase() === correct.toLowerCase()) {
                        b.classList.add('btn-correct');
                    }
                });
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 1700);
            }
        }

        // Initialize application on load
        init();
    </script>
</body>
</html>
